[project]
name = "quiff"
version = "0.1.0"
description = "Fast computer use for Windows desktop apps and Chrome: reads the screen as structured data, lets a small decision model pick each action, and calls a frontier model only when unsure."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Biprayan Choudhuri", email = "biprayanchoudhuri58@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quiff = "quiff.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
