<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quiff action-table fixture</title>
</head>
<body>
  <h1>Quiff fixture page</h1>
  <p>A small page for testing the browser action table offline.</p>
  <form onsubmit="event.preventDefault()">
    <label>Full name <input id="name" type="text" name="name" placeholder="Your name"></label>
    <label>
      Size
      <select id="size" name="size">
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
      </select>
    </label>
    <label><input type="checkbox" name="newsletter"> Subscribe to the newsletter</label>
    <label><input type="radio" name="plan" value="free"> Free plan</label>
    <label><input type="radio" name="plan" value="pro"> Pro plan</label>
    <button type="button" id="save">Save draft</button>
    <button type="submit" id="submit">Submit order</button>
    <a href="https://example.com/">Example link</a>
    <input type="search" name="q" placeholder="Search this site" aria-label="Site search">
    <button type="button" disabled>Disabled button</button>
  </form>
</body>
</html>
