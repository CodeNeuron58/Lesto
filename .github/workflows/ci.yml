name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync
      - name: Tests
        run: uv run pytest -q
      - name: CLI works
        run: uv run quiff --version
      - name: Build
        run: uv build
